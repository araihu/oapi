name: Publish OpenAPI catalogs
run-name: Reconcile OpenAPI · ${{ inputs.reconciliation_id || github.event_name }}

on:
  push:
    branches: [main]
  repository_dispatch:
    types: [specs-changed]
  workflow_dispatch:
    inputs:
      force:
        description: Rebuild and deploy even if source refs have not changed
        type: boolean
        default: false
      reconciliation_id:
        description: Correlation identifier supplied by the Cloudflare Cron Trigger
        type: string
        default: ''

permissions:
  contents: write

concurrency:
  group: oapi-production
  cancel-in-progress: false

jobs:
  publish:
    if: github.repository == 'araihu/oapi' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13'
      - name: Install publisher dependency
        run: python3 -m pip install -r requirements.txt
      - name: Check repository refs and persistent publication state
        id: probe
        env:
          FORCE_REBUILD: ${{ inputs.force || github.event_name == 'push' }}
        run: |
          flags=()
          if [[ "$FORCE_REBUILD" == true ]]; then flags+=(--force); fi
          python3 deploy.py probe "${flags[@]}"
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        if: steps.probe.outputs.changed == 'true'
        with:
          node-version: '24'
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        if: steps.probe.outputs.changed == 'true'
        with:
          go-version: '1.27.3'
          cache: false
      - name: Install exact Manja and Redocly versions
        if: steps.probe.outputs.changed == 'true'
        run: bash setup.sh
      - name: Validate publication and durable history behavior
        if: steps.probe.outputs.changed == 'true'
        run: |
          printf '{}\n' > aliases.json
          python3 -m unittest -v
          npm test
          python3 native_smoke.py
      - name: Export, verify, and persist release pins and immutable history
        if: steps.probe.outputs.changed == 'true'
        id: prepare
        env:
          FORCE_REBUILD: ${{ inputs.force || github.event_name == 'push' }}
        run: |
          flags=()
          if [[ "$FORCE_REBUILD" == true ]]; then flags+=(--force); fi
          python3 deploy.py prepare "${flags[@]}"
      - name: Atomically deploy the verified static export
        if: steps.prepare.outputs.changed == 'true'
        id: deploy
        env:
          ARAIHU_ASSETS_APP_ID: ${{ secrets.ARAIHU_ASSETS_APP_ID }}
          ARAIHU_ASSETS_APP_PRIVATE_KEY: ${{ secrets.ARAIHU_ASSETS_APP_PRIVATE_KEY }}
        run: |
          node .github/scripts/worker-secrets.mjs "$RUNNER_TEMP/oapi-worker-secrets.json"
          npm run deploy -- --secrets-file "$RUNNER_TEMP/oapi-worker-secrets.json"
      - name: Remove the temporary Worker secrets file
        if: always()
        run: |
          python3 - <<'PY'
          import os
          from pathlib import Path
          (Path(os.environ['RUNNER_TEMP']) / 'oapi-worker-secrets.json').unlink(missing_ok=True)
          PY
      - name: Check public pages, search digests, and source downloads
        if: steps.prepare.outputs.changed == 'true'
        run: python3 smoke.py
      - name: Verify the production domain and accept the deployment
        if: steps.prepare.outputs.changed == 'true'
        run: python3 deploy.py accept
      - name: Back up publication pins
        env:
          GH_TOKEN: ${{ github.token }}
          PUBLISHED: ${{ steps.prepare.outputs.changed }}
        run: python3 state_backup.py
      - name: Preserve previous publication and report failure
        if: failure()
        env:
          WORKER_DEPLOY_OUTCOME: ${{ steps.deploy.outcome }}
        run: python3 deploy.py failure
